# Redirect HTTP ke HTTPS
server {
    listen 8080;
    server_name xdxl-store.my.id b.xdxl-store.my.id;
    return 301 https://$host$request_uri;
}

# HTTPS - Website Halaman
server {
    listen 443 ssl http2;
    server_name xdxl-store.my.id;

    ssl_certificate /etc/website/webiste.crt;
    ssl_certificate_key /etc/website/webiste.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Batasi akses /admin — return 404 untuk IP tidak diizinkan ──
    location /admin {
        allow 127.0.0.1;
        allow ::1;
        allow 2a04:3543:1000:2310:5036:f6ff:fe08:4c2c;
        deny all;

        # Return 404 instead of 403
        error_page 403 =404 /404.html;
        
        proxy_pass http://127.0.0.1:2009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate limit endpoint API ──
    location = /api/login {
        limit_req zone=api_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:2009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/register {
        limit_req zone=api_register burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:2009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/forgot-password {
        limit_req zone=api_forgot burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:2009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:2009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS - API
server {
    listen 8443 ssl http2;
    server_name b.xdxl-store.my.id;

    ssl_certificate /etc/website/webiste.crt;
    ssl_certificate_key /etc/website/webiste.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
